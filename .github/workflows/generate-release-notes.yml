name: Generate AI release notes

# Reusable workflow: generates a release title and release notes from git
# history with OpenRouter's free models router (https://openrouter.ai/openrouter/free),
# and optionally creates or updates the GitHub release.
#
# Every repository that calls this workflow must define its own
# OPENROUTER_API_KEY secret and pass it in (explicitly or with `secrets: inherit`).

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to generate notes for. Defaults to the triggering tag (github.ref_name) when the caller runs on a tag.
        type: string
        default: ''
      previous-tag:
        description: Tag to diff against. Defaults to the closest earlier tag reachable from the release commit.
        type: string
        default: ''
      target:
        description: Commit-ish to release when the tag does not exist yet. Defaults to the triggering commit (github.sha).
        type: string
        default: ''
      tag-pattern:
        description: Glob used to pick the previous tag automatically (passed to `git describe --match`), e.g. `v*`.
        type: string
        default: ''
      model:
        description: "OpenRouter model ID to use, e.g. `anthropic/claude-sonnet-4.5`. Defaults to the free models router. List several, separated by commas or new lines, to fall back in order when one fails or you run out of credits, e.g. `anthropic/claude-sonnet-4.5, openrouter/free`. Empty means `openrouter/free`."
        type: string
        default: openrouter/free
      instructions:
        description: Extra instructions appended to the prompt (tone, audience, sections to emphasise, ...).
        type: string
        default: ''
      title-template:
        description: Release title template. `{tag}` is replaced with the tag and `{title}` with the AI-generated title.
        type: string
        default: '{tag}: {title}'
      max-commits:
        description: Maximum number of commits sent to the model.
        type: number
        default: 200
      max-input-chars:
        description: Maximum size of the git context sent to the model, in characters.
        type: number
        default: 60000
      temperature:
        description: Sampling temperature.
        type: number
        default: 0.3
      max-tokens:
        description: Maximum tokens in the model response.
        type: number
        default: 4096
      retries:
        description: Number of attempts against OpenRouter before giving up (free models are rate limited and vary in quality).
        type: number
        default: 3
      use-github-notes:
        description: "Also send GitHub's auto-generated notes (merged PRs, new contributors) to the model as context. Needs `contents: write`; skipped silently otherwise."
        type: boolean
        default: true
      append-changelog-link:
        description: Append a "Full Changelog" compare link to the notes.
        type: boolean
        default: true
      fail-on-error:
        description: Fail the job if the AI notes cannot be generated. When false, falls back to GitHub's notes (or a plain commit list) and the tag as title.
        type: boolean
        default: false
      create-release:
        description: "Create the GitHub release (or update it if it already exists) with the generated title and notes. Needs `contents: write`."
        type: boolean
        default: false
      draft:
        description: Create the release as a draft (only when a new release is created).
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease (only when a new release is created).
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      api-base-url:
        description: OpenRouter API base URL.
        type: string
        default: https://openrouter.ai/api/v1
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter API key. Must be set as a secret in each repository that uses this workflow.
        required: true
    outputs:
      title:
        description: Release title.
        value: ${{ jobs.generate.outputs.title }}
      notes:
        description: Release notes (Markdown).
        value: ${{ jobs.generate.outputs.notes }}
      tag:
        description: Tag the notes were generated for.
        value: ${{ jobs.generate.outputs.tag }}
      previous-tag:
        description: Tag the changes were compared against (empty if none).
        value: ${{ jobs.generate.outputs.previous-tag }}
      model:
        description: Model OpenRouter actually used (empty if the fallback was used).
        value: ${{ jobs.generate.outputs.model }}
      ai-generated:
        description: "'true' if the notes came from the model, 'false' if the fallback was used."
        value: ${{ jobs.generate.outputs.ai-generated }}
      release-url:
        description: URL of the created or updated release (only when create-release is true).
        value: ${{ jobs.generate.outputs.release-url }}

jobs:
  generate:
    name: Generate release notes
    runs-on: ${{ inputs.runs-on }}
    outputs:
      title: ${{ steps.generate.outputs.title }}
      notes: ${{ steps.generate.outputs.notes }}
      tag: ${{ steps.generate.outputs.tag }}
      previous-tag: ${{ steps.generate.outputs.previous-tag }}
      model: ${{ steps.generate.outputs.model }}
      ai-generated: ${{ steps.generate.outputs.ai-generated }}
      release-url: ${{ steps.release.outputs.url }}
    steps:
      - name: Require OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error title=OPENROUTER_API_KEY is not set::Add an OPENROUTER_API_KEY secret to this repository (Settings > Secrets and variables > Actions) and pass it to this reusable workflow under 'secrets:' (OPENROUTER_API_KEY) or with 'secrets: inherit'. Get a key at https://openrouter.ai/keys"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate title and notes
        id: generate
        shell: python
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.tag }}
          IN_PREVIOUS_TAG: ${{ inputs.previous-tag }}
          IN_TARGET: ${{ inputs.target }}
          IN_TAG_PATTERN: ${{ inputs.tag-pattern }}
          IN_MODEL: ${{ inputs.model }}
          IN_INSTRUCTIONS: ${{ inputs.instructions }}
          IN_TITLE_TEMPLATE: ${{ inputs.title-template }}
          IN_MAX_COMMITS: ${{ inputs.max-commits }}
          IN_MAX_INPUT_CHARS: ${{ inputs.max-input-chars }}
          IN_TEMPERATURE: ${{ inputs.temperature }}
          IN_MAX_TOKENS: ${{ inputs.max-tokens }}
          IN_RETRIES: ${{ inputs.retries }}
          IN_USE_GITHUB_NOTES: ${{ inputs.use-github-notes }}
          IN_APPEND_CHANGELOG_LINK: ${{ inputs.append-changelog-link }}
          IN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
          IN_API_BASE_URL: ${{ inputs.api-base-url }}
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          import uuid


          def env(name, default=""):
              return os.environ.get(name, default).strip()


          def env_bool(name):
              return env(name).lower() == "true"


          def env_num(name, default, cast=int):
              try:
                  return cast(float(env(name)))
              except ValueError:
                  return default


          def git(*args, check=True):
              proc = subprocess.run(["git", *args], capture_output=True, text=True)
              if check and proc.returncode != 0:
                  sys.exit(f"::error::git {' '.join(args)} failed: {proc.stderr.strip()}")
              return proc.stdout.rstrip() if proc.returncode == 0 else ""


          def set_output(name, value):
              delim = f"EOF_{uuid.uuid4().hex}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}<<{delim}\n{value}\n{delim}\n")


          def log(level, message):
              # Keep model output out of the log: it could contain workflow commands.
              print(f"::{level}::{message}", flush=True)


          repo = env("GITHUB_REPOSITORY")
          server = env("GITHUB_SERVER_URL", "https://github.com")
          api_url = env("GITHUB_API_URL", "https://api.github.com")

          # ---------------------------------------------------------------- refs
          tag = env("IN_TAG")
          if not tag and env("GITHUB_REF_TYPE") == "tag":
              tag = env("GITHUB_REF_NAME")
          if not tag:
              sys.exit("::error::No tag to release. Pass the `tag` input or run the caller on a tag push / release event.")

          tag_exists = bool(git("rev-parse", "-q", "--verify", f"refs/tags/{tag}^{{commit}}", check=False))
          head_ref = tag if tag_exists else (env("IN_TARGET") or env("GITHUB_SHA"))
          head_sha = git("rev-parse", f"{head_ref}^{{commit}}")

          previous_tag = env("IN_PREVIOUS_TAG")
          if not previous_tag:
              describe = ["describe", "--tags", "--abbrev=0"]
              if env("IN_TAG_PATTERN"):
                  describe += ["--match", env("IN_TAG_PATTERN")]
              previous_tag = git(*describe, f"{head_sha}^", check=False)
              if previous_tag == tag:
                  previous_tag = ""
          elif not git("rev-parse", "-q", "--verify", f"refs/tags/{previous_tag}^{{commit}}", check=False):
              sys.exit(f"::error::previous-tag '{previous_tag}' does not exist.")

          rev_range = f"{previous_tag}..{head_sha}" if previous_tag else head_sha
          print(f"Release: {tag} ({head_sha[:12]}), comparing against: {previous_tag or '(beginning of history)'}")

          # ------------------------------------------------------------- context
          max_commits = env_num("IN_MAX_COMMITS", 200)
          total_commits = int(git("rev-list", "--count", "--no-merges", rev_range) or 0)
          raw_log = git("log", "--no-merges", f"-n{max_commits}", "--format=%x1e%h%x1f%an%x1f%s%x1f%b", rev_range)
          commit_lines = []
          for entry in filter(None, raw_log.split("\x1e")):
              sha, author, subject, body = (entry.split("\x1f") + ["", "", "", ""])[:4]
              line = f"- {subject.strip()} ({sha}, {author})"
              body = "\n".join(f"    {b}" for b in body.strip().splitlines() if b.strip())
              commit_lines.append(f"{line}\n{body}" if body else line)
          commits_text = "\n".join(commit_lines) or "(no commits)"
          if total_commits > len(commit_lines):
              commits_text += f"\n... and {total_commits - len(commit_lines)} older commits not shown"

          # Breaking changes flagged with Conventional Commits markers ("feat!:",
          # "fix(api)!:" or a "BREAKING CHANGE:" footer), across the whole range.
          BREAKING_SUBJECT = re.compile(r"^[A-Za-z]+(?:\([^)]*\))?!:\s*")
          CONVENTIONAL_PREFIX = re.compile(r"^[A-Za-z]+(?:\([^)]*\))?!?:\s*")
          BREAKING_FOOTER = re.compile(r"^BREAKING[ -]CHANGES?:\s*(.*)$")
          # Any Conventional Commits / git trailer token, which ends a multi-line footer value.
          FOOTER_TOKEN = re.compile(r"^(?:BREAKING[ -]CHANGES?|[A-Za-z][\w-]*)(?::\s|\s#)")


          def breaking_footer(body):
              """Return the lines of a BREAKING CHANGE footer, continuation lines included, or None."""
              lines = body.splitlines()
              for i, line in enumerate(lines):
                  match = BREAKING_FOOTER.match(line)
                  if not match:
                      continue
                  value = [match.group(1).strip()]
                  for following in lines[i + 1 :]:
                      if FOOTER_TOKEN.match(following):
                          break
                      value.append(following.rstrip())
                  return [v for v in value if v.strip()]
              return None


          breaking_changes = []  # (short sha, subject without type prefix, Markdown bullet)
          raw_breaking = git(
              "log", "--no-merges", "-E",
              "--grep=^[A-Za-z]+(\\([^)]*\\))?!:", "--grep=^BREAKING[ -]CHANGES?:",
              "--format=%x1e%h%x1f%s%x1f%b", rev_range,
          )
          for entry in filter(None, raw_breaking.split("\x1e")):
              sha, subject, body = (entry.split("\x1f") + ["", "", ""])[:3]
              subject = subject.strip()
              footer = breaking_footer(body)
              if not BREAKING_SUBJECT.match(subject) and footer is None:
                  continue
              sha, summary = sha.strip(), CONVENTIONAL_PREFIX.sub("", subject)
              item = f"- {summary} ({sha})"
              if footer:
                  item += f": {footer[0]}" + "".join(f"\n  {line.strip()}" for line in footer[1:])
              breaking_changes.append((sha, summary, item))
          if breaking_changes:
              print(f"Detected {len(breaking_changes)} breaking change(s) from commit markers.")
          breaking_text = "\n".join(item for _, _, item in breaking_changes)

          diffstat = git("diff", "--stat=120", f"{previous_tag}..{head_sha}", check=False) if previous_tag else ""
          stat_lines = diffstat.splitlines()
          if len(stat_lines) > 80:
              diffstat = "\n".join(stat_lines[:79] + [stat_lines[-1]])

          github_notes = ""
          if env_bool("IN_USE_GITHUB_NOTES") and env("GITHUB_TOKEN"):
              payload = {"tag_name": tag, "target_commitish": head_sha}
              if previous_tag:
                  payload["previous_tag_name"] = previous_tag
              req = urllib.request.Request(
                  f"{api_url}/repos/{repo}/releases/generate-notes",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {env('GITHUB_TOKEN')}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      github_notes = json.load(resp).get("body", "").strip()
              except Exception as exc:  # noqa: BLE001 - best-effort context only
                  print(f"GitHub generated notes unavailable ({exc}); continuing with git history only.")

          budget = env_num("IN_MAX_INPUT_CHARS", 60000)
          sections = [
              ("Breaking changes flagged in commit messages (every one MUST be listed under ⚠️ Breaking Changes)", breaking_text),
              ("GitHub generated notes (merged pull requests and contributors)", github_notes),
              ("Files changed", diffstat),
              ("Commits (newest first)", commits_text),
          ]
          context_parts = []
          for heading, body in sections:
              if not body:
                  continue
              block = f"## {heading}\n{body}"
              if len(block) > budget:
                  block = block[: max(budget, 0)] + "\n... (truncated)"
              budget -= len(block)
              context_parts.append(block)
              if budget <= 0:
                  break

          # -------------------------------------------------------------- prompt
          system_prompt = """You write release notes for software projects from git history.
          Respond with ONLY a JSON object, without code fences, of the form {"title": string, "notes": string}.

          "title": a short, human-friendly release title (at most 60 characters) that captures the main theme of the release. Do not include the version number. No trailing period. No emoji.

          "notes": GitHub-flavored Markdown. If the release has any breaking changes (changes that require users to modify code, configuration or workflows when upgrading: removed or renamed APIs, options or commands, changed defaults or behaviour, dropped platform support), the notes MUST begin with a level-3 "⚠️ Breaking Changes" section, before anything else, listing each one with what users need to do to upgrade. Every change listed in the input as a flagged breaking change is breaking, and its bullet must end with that commit's short hash in parentheses, e.g. (a1b2c3d). Next, write a 1-3 sentence summary of the release. Then group the remaining changes under level-3 headings chosen from this list, in this order, leaving out any that would be empty: "✨ New Features", "🐛 Bug Fixes", "⚡ Performance", "📚 Documentation", "🔧 Maintenance". Write each change as one concise, user-facing bullet and merge related commits into a single bullet. Keep pull request references (#123) and @mentions exactly as they appear in the input. Leave out noise such as merge commits, typo fixes and CI tweaks unless nothing else changed. Never invent changes that the input does not support. Do not add a top-level heading, the version number, or a "Full Changelog" link."""
          system_prompt = "\n".join(line.strip() for line in system_prompt.splitlines())

          user_prompt = "\n\n".join(
              [
                  f"Repository: {repo}",
                  f"Release: {tag}",
                  f"Previous release: {previous_tag or 'none (first release)'}",
                  f"Commits in this release: {total_commits}",
                  *([f"Additional instructions from the maintainers:\n{env('IN_INSTRUCTIONS')}"] if env("IN_INSTRUCTIONS") else []),
                  *context_parts,
              ]
          )

          # ---------------------------------------------------------- OpenRouter
          def parse_response(content):
              content = re.sub(r"<think>.*?</think>", "", content or "", flags=re.S).strip()
              fenced = re.search(r"```(?:json)?\s*(\{.*\})\s*```", content, flags=re.S)
              if fenced:
                  content = fenced.group(1)
              start, end = content.find("{"), content.rfind("}")
              if start == -1 or end <= start:
                  raise ValueError("response contains no JSON object")
              data = json.loads(content[start : end + 1])
              title = data.get("title") if isinstance(data, dict) else None
              notes = data.get("notes") if isinstance(data, dict) else None
              if not isinstance(title, str) or not isinstance(notes, str):
                  raise ValueError("response JSON is missing string 'title' / 'notes'")
              title = " ".join(title.split()).strip().strip("\"'`#*").rstrip(".").strip()
              notes = notes.strip()
              if not title or not notes:
                  raise ValueError("response has an empty title or notes")
              return title[:100], notes


          FREE_ROUTER = "openrouter/free"
          models = [m.strip() for m in re.split(r"[,\n]", env("IN_MODEL")) if m.strip()] or [FREE_ROUTER]
          print(f"Model{'s' if len(models) > 1 else ''}: {', '.join(models)}")


          def call_openrouter(use_json_mode):
              body = {
                  "model": models[0],
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ],
                  "temperature": env_num("IN_TEMPERATURE", 0.3, float),
                  "max_tokens": env_num("IN_MAX_TOKENS", 4096),
                  "reasoning": {"exclude": True},
              }
              if len(models) > 1:
                  body["models"] = models[1:]  # OpenRouter tries these in order if the first fails
              if use_json_mode:
                  body["response_format"] = {"type": "json_object"}
              req = urllib.request.Request(
                  f"{env('IN_API_BASE_URL').rstrip('/')}/chat/completions",
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {env('OPENROUTER_API_KEY')}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": f"{server}/{repo}",
                      "X-Title": "free-ai-release-notes",
                  },
              )
              with urllib.request.urlopen(req, timeout=180) as resp:
                  data = json.load(resp)
              if data.get("error"):
                  raise RuntimeError(f"OpenRouter error: {data['error']}")
              choice = (data.get("choices") or [{}])[0]
              title, notes = parse_response((choice.get("message") or {}).get("content"))
              return title, notes, data.get("model", "")


          ai_title = ai_notes = used_model = ""
          attempts = max(env_num("IN_RETRIES", 3), 1)
          use_json_mode = True
          for attempt in range(1, attempts + 1):
              try:
                  ai_title, ai_notes, used_model = call_openrouter(use_json_mode)
                  print(f"Generated notes with {used_model or 'unknown model'} on attempt {attempt}.")
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")[:500]
                  if exc.code == 401:
                      sys.exit("::error::OpenRouter rejected OPENROUTER_API_KEY (HTTP 401). Check the secret's value.")
                  if exc.code == 402:
                      # Out of credits: retrying won't help. A negative balance also blocks free models.
                      hint = (
                          "Your OpenRouter balance may be negative, which blocks free models too; add credits."
                          if FREE_ROUTER in models or all(m.endswith(":free") for m in models)
                          else f"Add credits, or add {FREE_ROUTER} as a fallback in the `model` input to stay free."
                      )
                      log("warning", f"OpenRouter returned HTTP 402 (insufficient credits) for {', '.join(models)}. {hint} Detail: {detail}")
                      break
                  if exc.code == 400 and use_json_mode:
                      use_json_mode = False
                  log("warning", f"Attempt {attempt}/{attempts}: OpenRouter returned HTTP {exc.code}: {detail}")
              except Exception as exc:  # noqa: BLE001
                  log("warning", f"Attempt {attempt}/{attempts}: {exc}")
              if attempt < attempts:
                  time.sleep(min(5 * 2 ** (attempt - 1), 60))

          # -------------------------------------------------------------- output
          # Headings that announce breaking changes ("⚠️ Breaking Changes", "Breaking:", "Breaking API
          # changes"), not ones that merely mention the word ("Fixes for breaking builds").
          BREAKING_HEADING = re.compile(r"^[^\w]*breaking\b(?![ -]?(?:builds?|tests?)\b)", re.I)
          GITHUB_BODY_LIMIT = 125000
          LIST_LINE = re.compile(r"^(\s*([-*+]|\d+[.)])\s|\s{2,}\S)")  # a list item or an indented continuation


          def breaking_first(markdown):
              """Move every "Breaking" section (with its sub-sections) to the top.

              If none exists but commits flagged breaking changes, add one.
              """
              # [heading level, is breaking, lines, index of first sub-heading,
              #  index of the last line of the section's own list (items, continuations and their code blocks)]
              blocks = [[0, False, [], None, None]]
              fence = None  # (character, length) of the open code fence
              last_markdown_level = 0  # level of the most recent "#" heading
              item_open = False  # inside a list item of the current block, before any sub-heading
              fence_in_item = False  # the open code fence belongs to that list item
              for line in markdown.splitlines():
                  run = re.match(r"^ {0,3}(`{3,}|~{3,})|^\s+(`{3,}|~{3,})", line)
                  marker = (run.group(1) or run.group(2)) if run else ""
                  in_fence = fence is not None or bool(marker)
                  opening = fence is None and bool(marker)
                  if fence is None and marker:
                      fence = (marker[0], len(marker))
                  elif fence and marker[:1] == fence[0] and len(marker) >= fence[1] and line.strip() == marker:
                      fence = None  # closing fence: same character, at least as long, nothing after it
                  # Markdown headings, plus whole-line bold text used as a heading.
                  heading = None if in_fence else (
                      re.match(r"^(#{1,6})\s+(.*)$", line) or re.match(r"^(\*\*)(.+?)\*\*:?\s*$", line)
                  )
                  # A bold line under a "#" heading is a label one level below it ("**Migration:**" stays
                  # in its section), but never above the prompt's section level 3: with no "#" heading
                  # above, or under a "# Title", a following "#### Migration" stays with it while
                  # "### Features" does not.
                  if not heading:
                      level = 0
                  elif heading.group(1).startswith("#"):
                      level = last_markdown_level = len(heading.group(1))
                  else:
                      level = max(last_markdown_level + 1, 3)
                  current = blocks[-1]
                  if heading and not (current[1] and level > current[0]):
                      blocks.append([level, bool(BREAKING_HEADING.search(heading.group(2))), [line], None, None])
                      item_open = fence_in_item = False
                  else:
                      if heading and current[3] is None:
                          current[3] = len(current[2])  # a sub-heading kept inside a breaking section
                          item_open = False
                      elif current[3] is None:
                          if opening:
                              # A code block right after a list item (e.g. a migration example) belongs to it.
                              fence_in_item = item_open
                              if fence_in_item:
                                  current[4] = len(current[2])
                          elif in_fence:
                              if fence_in_item:
                                  current[4] = len(current[2])
                          elif not line.strip():
                              pass  # blank lines don't end a list item
                          elif LIST_LINE.match(line):
                              item_open = True
                              current[4] = len(current[2])
                          else:
                              item_open = False  # unindented text after the list ends it
                      current[2].append(line)

              def join(selected):
                  texts = ("\n".join(b[2]).strip("\n") for b in selected)
                  return "\n\n".join(t for t in texts if t.strip())

              breaking = [b for b in blocks if b[1]]
              rest = join(b for b in blocks if not b[1])
              if breaking:
                  section = join(breaking)
                  # Match by hash. Fall back to the subject only when it is unambiguous: no other flagged
                  # subject equals or contains it, and it appears as a whole phrase (so "remove --force"
                  # is not found inside "remove --force-all").
                  subjects = [summary.lower() for _, summary, _ in breaking_changes]

                  def subject_present(summary):
                      lowered = summary.lower()
                      if sum(lowered in other for other in subjects) != 1:
                          return False
                      return re.search(r"(?<![\w-])" + re.escape(lowered) + r"(?![\w-])", section.lower()) is not None

                  missing = [
                      item for sha, summary, item in breaking_changes
                      if sha not in section and not subject_present(summary)
                  ]
                  if missing:
                      # Insert after the first breaking section's own bullets, before any sub-heading
                      # (found by the fence-aware parse above, so never inside a code block).
                      first = breaking[0][2]
                      # Right after the section's own list, so not after any text that follows it.
                      if breaking[0][4] is not None:
                          at = breaking[0][4] + 1
                      else:
                          at = breaking[0][3] if breaking[0][3] is not None else len(first)
                          while at > 1 and not first[at - 1].strip():
                              at -= 1
                      if not (LIST_LINE.match(first[at - 1]) or first[at - 1].lstrip().startswith(("#", "**"))):
                          missing = [""] + missing  # e.g. after a code block: start a new list
                      first[at:at] = missing
                  top = join(breaking)
              elif breaking_text:
                  top = f"### ⚠️ Breaking Changes\n{breaking_text}"
              else:
                  return markdown
              return f"{top}\n\n{rest}".strip()


          compare_link = f"**Full Changelog**: {server}/{repo}/compare/{previous_tag}...{tag}" if previous_tag else ""
          if ai_notes:
              title = env("IN_TITLE_TEMPLATE", "{tag}: {title}").replace("{tag}", tag).replace("{title}", ai_title)
              notes = breaking_first(ai_notes)
              if compare_link and env_bool("IN_APPEND_CHANGELOG_LINK"):
                  notes += f"\n\n{compare_link}"
          else:
              if env_bool("IN_FAIL_ON_ERROR"):
                  sys.exit("::error::Could not generate release notes with OpenRouter.")
              log("warning", "Could not generate release notes with OpenRouter; using fallback notes.")
              title = tag
              if github_notes:
                  notes = github_notes
              else:
                  notes = "## What's Changed\n" + "\n".join(line.splitlines()[0] for line in commit_lines)
                  if compare_link and env_bool("IN_APPEND_CHANGELOG_LINK"):
                      notes += f"\n\n{compare_link}"
              notes = breaking_first(notes)

          if len(notes) >= GITHUB_BODY_LIMIT:  # the notes file adds a trailing newline
              # GitHub rejects release bodies over 125,000 characters. Breaking changes are at the top, so they survive.
              link = compare_link if compare_link and env_bool("IN_APPEND_CHANGELOG_LINK") else ""
              note = "\n\n_Release notes truncated to fit GitHub's size limit._" + (f"\n\n{link}" if link else "")
              notes = notes[: GITHUB_BODY_LIMIT - 1 - len(note)].rsplit("\n", 1)[0] + note
              log("warning", "Release notes exceeded GitHub's 125,000-character limit and were truncated.")

          notes_file = os.path.join(env("RUNNER_TEMP") or ".", "release-notes.md")
          with open(notes_file, "w", encoding="utf-8") as fh:
              fh.write(notes + "\n")

          set_output("title", title)
          set_output("notes", notes)
          set_output("notes-file", notes_file)
          set_output("tag", tag)
          set_output("previous-tag", previous_tag)
          set_output("head-sha", head_sha)
          set_output("model", used_model if ai_notes else "")
          set_output("ai-generated", "true" if ai_notes else "false")

          if env("GITHUB_STEP_SUMMARY"):
              source = f"`{used_model}` via OpenRouter" if ai_notes else "fallback (AI generation failed)"
              with open(env("GITHUB_STEP_SUMMARY"), "a", encoding="utf-8") as fh:
                  fh.write(f"# {title}\n\n{notes}\n\n---\n_Generated by {source}._\n")

      - name: Create or update release
        id: release
        if: inputs.create-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.generate.outputs.tag }}
          TITLE: ${{ steps.generate.outputs.title }}
          NOTES_FILE: ${{ steps.generate.outputs.notes-file }}
          HEAD_SHA: ${{ steps.generate.outputs.head-sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "Creating release $TAG"
            args=(--repo "$REPO" --title "$TITLE" --notes-file "$NOTES_FILE" --target "$HEAD_SHA")
            if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          url="$(gh release view "$TAG" --repo "$REPO" --json url --jq .url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Release: $url" >> "$GITHUB_STEP_SUMMARY"
