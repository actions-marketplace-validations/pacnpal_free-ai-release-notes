# Create a GitHub release with an AI-written title and notes whenever a
# version tag is pushed.
#
# Copy to .github/workflows/release.yml in your repository and add an
# OPENROUTER_API_KEY repository secret.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the action needs the history since the previous tag

      - uses: pacnpal/free-ai-release-notes@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          create-release: true
          tag-pattern: 'v*'
          # Optional: use your own model (default: openrouter/free), with the free router as a fallback.
          # model: anthropic/claude-sonnet-4.5, openrouter/free
