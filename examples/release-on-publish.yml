# Rewrite the title and notes of a release when it is published from the
# GitHub UI (or by another tool), keeping everything else about the release.
name: AI release notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pacnpal/free-ai-release-notes@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          create-release: true # updates the existing release in place
