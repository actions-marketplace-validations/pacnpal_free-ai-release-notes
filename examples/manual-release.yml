# Cut a release by hand: pick a version, the tag is created on the selected
# branch and the release gets an AI-written title and notes.
name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create (e.g. v1.4.0)
        required: true
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pacnpal/free-ai-release-notes@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          tag: ${{ inputs.version }}
          target: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          draft: true # review before publishing
          create-release: true
