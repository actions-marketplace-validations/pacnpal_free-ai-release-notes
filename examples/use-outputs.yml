# Only generate the title and notes, then use them in your own release job
# (here: build artifacts and upload them with the GitHub CLI).
name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  notes:
    uses: pacnpal/free-ai-release-notes/.github/workflows/generate-release-notes.yml@main
    with:
      instructions: Write for end users, not developers. Mention upgrade steps if any.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  release:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make dist # your build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
          TITLE: ${{ needs.notes.outputs.title }}
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md
