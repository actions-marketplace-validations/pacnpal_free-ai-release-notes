# Only generate the title and notes, then use them in your own release step
# (here: build artifacts and upload them with the GitHub CLI).
name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: notes
        uses: pacnpal/free-ai-release-notes@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          instructions: Write for end users, not developers. Mention upgrade steps if any.

      - run: make dist # your build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        run: gh release create "$TAG" dist/* --title "$TITLE" --notes-file "$NOTES_FILE"
